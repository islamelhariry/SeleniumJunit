plugins {
    id 'java'
}

group 'dev.selenium'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext['seleniumVersion'] = System.getProperty('selenium.version', '4.43.0')

dependencies {
    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    testImplementation "org.seleniumhq.selenium:htmlunit3-driver:${seleniumVersion}"
    testImplementation "org.seleniumhq.selenium:selenium-grid:${seleniumVersion}"

    testImplementation platform("org.junit:junit-bom:6.0.2")
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.titusfortner:selenium-logger:2.4.0'
}

//
// Apply these settings to ALL Test tasks (test, smokeTest, regressionTest, etc.)
//
tasks.withType(Test).configureEach {

    // Exclude Selenium example tests
    exclude '**/dev/selenium/**'

    // Forward ALL system properties (-Dbrowser, -Dheadless, -Dremote, etc.)
    systemProperties System.getProperties()

    // Use JUnit 5
    useJUnitPlatform()

    // Logging
    testLogging {
        events "passed", "skipped", "failed"
    }

    // Ensure correct classpath
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

//
// Default test task
//
test {
    // Nothing needed here — everything inherited from configureEach
}

//
// SMOKE SUITE
//
tasks.register('smokeTest', Test) {
    description = "Runs smoke test suite"
    group = "verification"

    useJUnitPlatform {
        includeTags 'smoke'
    }
}

//
// REGRESSION SUITE
//
tasks.register('regressionTest', Test) {
    description = "Runs regression test suite"
    group = "verification"

    useJUnitPlatform {
        includeTags 'regression'
    }
}

//
// FULL SUITE (smoke + regression)
//
tasks.register('fullTest', Test) {
    description = "Runs full test suite"
    group = "verification"

    useJUnitPlatform {
        includeTags 'smoke', 'regression'
    }
}